mshuo-reply-to-see:
  admin:
    description: "Hide content inside [REPLY]...[/REPLY]. Only the discussion starter can hide content, including later replies. Others can view it after replying. Tags typed by anyone else are removed and the text is shown."
    settings:
      reply-type-lable: Reply display options
      reply-type-lable-helpText: "Reply to topic: reply in the discussion to view hidden content. Reply to the specified post: reply to the post that contains the hidden content. Only the discussion starter can use hide tags."
      theme-type-parse-lable: Post parsing mode when replying to a topic
      theme-type-parse-helpText: "Only takes effect when Reply display options is set to Reply to Topic"
    permissions:
      reply-to-see-lable: View hidden content without replying
    reply-type:
      0: Reply to topic to reveal hidden content (Default)
      1: Reply to specified post to reveal hidden content
    theme-type-parse:
      0: First post only (Default, best performance)
      1: All posts
  forum:
      must-reply-specific: Reply to unlock
      must-reply-theme: Join the discussion to view
      insert-reply-to-see: Reply to unlock hidden content